<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VEYQORO Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout concept: one calm column, five screens in a fixed order, a step bar on top, a prototype banner that never leaves. */
:root {
  --bg: #f4f7f7;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #4a5a66;
  --accent: #0b5d63;
  --accent-fg: #ffffff;
  --accent-soft: #e1f0f1;
  --line: #d3dee1;
  --ok: #1c6b45;
  --ok-soft: #e1f3e8;
  --note-soft: #fff4d6;
  --note-fg: #5a4300;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1f; --surface: #15252b; --fg: #e8eef0; --muted: #a2b4bc;
    --accent: #5cc2c9; --accent-fg: #06262a; --accent-soft: #17353a; --line: #2a3f46;
    --ok: #7bd9a3; --ok-soft: #153126; --note-soft: #3a3010; --note-fg: #f3dea0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1f; --surface: #15252b; --fg: #e8eef0; --muted: #a2b4bc;
  --accent: #5cc2c9; --accent-fg: #06262a; --accent-soft: #17353a; --line: #2a3f46;
  --ok: #7bd9a3; --ok-soft: #153126; --note-soft: #3a3010; --note-fg: #f3dea0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5; margin: 0;
  padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; }
.banner {
  background: var(--note-soft); color: var(--note-fg); font-size: 13px; font-weight: 600;
  padding: 8px 16px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  text-align: center;
}
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 12px; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; }
.brand span { color: var(--accent); font-weight: 400; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 99px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 20px; margin: 0; list-style: none; }
.steps button {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
  border-radius: 99px; padding: 6px 12px; cursor: pointer; min-height: 36px;
}
.steps button[aria-current="step"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 24px; min-width: 0; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.2; margin: 0 0 6px; font-weight: 800; text-wrap: balance; }
p { margin: 0 0 16px; max-width: 62ch; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.btn {
  font: inherit; font-weight: 600; font-size: 15px; border-radius: 8px; padding: 12px 20px; cursor: pointer; min-height: 44px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.items { display: flex; flex-direction: column; gap: 12px; margin: 20px 0 0; padding: 0; list-style: none; }
.item { border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.item .body { flex: 1; min-width: 0; }
.item h3 { margin: 0 0 2px; font-size: 16px; font-weight: 800; }
.item .detail { margin: 0 0 6px; font-size: 14px; color: var(--muted); max-width: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-soft); border-radius: 99px; padding: 3px 10px; }
.tag svg { width: 12px; height: 12px; }
.tag.pending { color: var(--muted); background: var(--accent-soft); }
.item label { display: flex; gap: 12px; align-items: flex-start; width: 100%; cursor: pointer; }
.item input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 4px; }
.who .name { font-weight: 800; font-size: 18px; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; font-weight: 600; font-size: 15px; margin-top: 20px; }
.status { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--ok); min-height: 22px; }
.foot { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; }

/* Sample documents: always drawn as light paper, in both themes, with a watermark that cannot be missed. */
.doc { position: relative; overflow: hidden; background: #fbfaf5; color: #1d2328; border: 1px solid #c9c6bb; border-radius: 6px;
  padding: 14px 16px; font-size: 12px; line-height: 1.45; font-family: Georgia, 'Times New Roman', serif; min-width: 0; }
.doc::after { content: 'SAMPLE · MUSTER'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-18deg);
  font: 800 clamp(15px, 5vw, 34px)/1 'Manrope', system-ui, sans-serif; letter-spacing: 0.04em; color: rgba(190, 40, 40, 0.22);
  border: 3px solid rgba(190, 40, 40, 0.22); padding: 4px 14px; white-space: nowrap; pointer-events: none; }
.doc h4 { margin: 0 0 8px; font: 700 13px/1.2 'Manrope', system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: #27414a; }
.doc .sub { color: #5b6770; font-size: 11px; margin: 0 0 8px; max-width: none; }
.doc dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
.doc dt { color: #5b6770; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; align-self: center; }
.doc dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.doc .photo { float: left; width: 64px; height: 80px; margin: 0 12px 6px 0; background: #dfe3e4; border: 1px solid #c3c9cb; border-radius: 3px;
  display: flex; align-items: center; justify-content: center; color: #8a969b; font: 600 9px/1.2 'Manrope', system-ui, sans-serif; text-align: center; }
.doc .mrz { clear: both; margin: 8px 0 0; padding-top: 6px; font: 600 clamp(6.5px, 2.15vw, 11px)/1.35 'Courier New', monospace; letter-spacing: 0; overflow: hidden; white-space: nowrap; }
.doc table { border-collapse: collapse; width: 100%; }
.doc td { padding: 2px 0; vertical-align: top; }
.doc td:last-child { text-align: right; font-weight: 700; }
.doc .rule { border-top: 1px solid #c9c6bb; margin: 8px 0; }
.dcard { border: 1.5px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 16px; min-width: 0; }
.dcard .cap { margin: 8px 0 10px; font-size: 13px; color: var(--muted); max-width: none; }
.dres { margin-top: 12px; border-radius: 8px; background: var(--ok-soft); padding: 12px 14px; }
.dres ul { margin: 6px 0 8px; padding-left: 18px; font-size: 14px; }
.dres .tok { font: 600 13px/1.3 'Courier New', monospace; overflow-wrap: anywhere; }
.dres .small { font-size: 12px; color: var(--muted); margin: 6px 0 0; max-width: none; }
.grp { margin: 24px 0 0; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
</style>

<div class="banner" id="banner"></div>

function t() { return T[state.lang]; }
function tag(text) { return '<span class="tag">' + CHECK + text + '</span>'; }
function item(title, detail, tagHtml) {
  return '<li class="item"><div class="body"><h3>' + title + '</h3><p class="detail">' + detail + '</p>' + tagHtml + '</div></li>';

function sharedKeys() {

  if (state.share.id) k.push('id');
  if (state.share.mo) k.push('mo');
  if (state.share.fl && state.flatsAdded) k.push('fl');

}
function itemFor(key) {
  var s = t();
  if (key === 'id') return item(s.idT, s.idD, tag(s.idV));
  if (key === 'mo') return item(s.moT, s.moD, tag(s.moV));
  return item(s.flT, s.flDYes, tag(s.flV));

function docCard(key, capKey, resKey) {
  var s = t();
  var done = state.checked[key], busy = state.busy[key];
  var h = '<div class="dcard">' + DOCS[key]() + '<p class="cap">' + s[capKey] + '</p>';
  if (done) {
    h += '<div class="dres"><span class="tag">' + CHECK + s.verified + '</span><ul>' + s[resKey].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' +

  }
  return h + '</div>';

function render() {

    h = '<h1>' + s.wTitle + '</h1><p class="muted">' + s.wText + '</p>' +
        '<div class="row"><button type="button" class="btn" data-go="1">' + s.wTenant + '</button>' +
        '<button type="button" class="btn ghost" data-go="4">' + s.wLandlord + '</button></div>' +
        '<div class="callout">' + s.wNote + '</div>';
  } else if (state.screen === 1) {
    h = '<h2>' + s.dTitle + '</h2><p class="muted">' + s.dText + '</p>' +
        '<div class="grp">' + s.dTenant + '</div>' + docCard('d1', 'dc1', 'r1') + docCard('d2', 'dc2', 'r2') + docCard('d3', 'dc3', 'r3') +
        '<div class="grp">' + s.dLandlord + '</div>' + docCard('d4', 'dc4', 'r4') +
        '<div class="callout">' + s.dNote + '</div>' +
        '<div class="row"><button type="button" class="btn" data-go="2">' + s.dContinue + '</button><button type="button" class="btn ghost" data-go="0">' + s.back + '</button></div>';
  } else if (state.screen === 2) {
    h = '<div class="who"><span class="name">' + s.pName + '</span><span class="muted">' + s.pSub + '</span></div><h2>' + s.pTitle + '</h2>' +
        '<ul class="items">' + itemFor('id') + itemFor('mo');
    if (state.flatsAdded) {
      h += itemFor('fl');
    } else {
      h += '<li class="item"><div class="body"><h3>' + s.flT + '</h3><p class="detail">' + s.flDNo + '</p>' +
           '<span class="tag pending">' + s.notAdded + '</span> <button type="button" class="btn ghost" data-act="addref" style="margin-top:8px">' + s.addRef + '</button></div></li>';
    }
    h += '</ul><div class="row"><button type="button" class="btn" data-go="3">' + s.pShare + '</button></div>';
  } else if (state.screen === 3) {
    h = '<h2>' + s.sTitle + '</h2><p class="muted">' + s.sText + '</p><p><strong>' + s.sTo + '</strong></p><ul class="items">' +
        '<li class="item"><label><input type="checkbox" data-share="id"' + (state.share.id ? ' checked' : '') + '><span><strong>' + s.idT + '</strong><br><span class="detail muted">' + s.idD + '</span></span></label></li>' +
        '<li class="item"><label><input type="checkbox" data-share="mo"' + (state.share.mo ? ' checked' : '') + '><span><strong>' + s.moT + '</strong><br><span class="detail muted">' + s.moD + '</span></span></label></li>' +
        '<li class="item"><label><input type="checkbox" data-share="fl"' + (state.share.fl && state.flatsAdded ? ' checked' : '') + (state.flatsAdded ? '' : ' disabled') + '><span><strong>' + s.flT + '</strong><br><span class="detail muted">' + (state.flatsAdded ? s.flDYes : s.notAdded) + '</span></span></label></li>' +
        '</ul><div class="row"><button type="button" class="btn" data-go="4">' + s.share + '</button><button type="button" class="btn ghost" data-go="2">' + s.back + '</button></div>';
  } else if (state.screen === 4) {
    var keys = sharedKeys();
    h = '<div class="who"><span class="name">' + s.lTitle + '</span></div><p class="muted">' + s.lSub + '</p>' +
        (keys.length ? '<ul class="items">' + keys.map(itemFor).join('') + '</ul>' : '<p>' + s.lNone + '</p>') +
        '<div class="callout">' + s.lCallout + '</div>' +
        '<div class="row"><button type="button" class="btn ghost" data-act="ask">' + s.more + '</button><button type="button" class="btn" data-go="5">' + s.toCheck + '</button></div>' +
        '<div class="status" role="status">' + (state.asked ? s.moreDone : '') + '</div>';
  } else {
    h = '<h2>' + s.fTitle + '</h2><p class="muted">' + s.fSub + '</p><ul class="items">' +
        item(s.f1T, s.f1D, tag(s.verified)) + item(s.f2T, s.f2D, tag(s.verified)) + item(s.f3T, s.f3D, tag(s.verified)) +
        item(s.f4T, s.f4D, '<span class="tag pending">' + s.notAdded + '</span>') +
        '</ul><div class="row"><button type="button" class="btn" data-go="0">' + s.toStart + '</button></div>';
  }
  document.getElementById('screen').innerHTML = h;
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-go],[data-act],[data-check],#lang-en,#lang-de');
  if (!el) return;
  if (el.id === 'lang-en') { state.lang = 'en'; render(); return; }
  if (el.id === 'lang-de') { state.lang = 'de'; render(); return; }
  if (el.dataset.check) {
    var k = el.dataset.check;
    state.busy[k] = true; render();
    setTimeout(function () { state.busy[k] = false; state.checked[k] = true; render(); }, 800);
    return;
  }
  if (el.dataset.act === 'addref') { state.flatsAdded = true; render(); return; }
  if (el.dataset.act === 'ask') { state.asked = true; render(); return; }
  if (el.dataset.go !== undefined) {
    state.screen = parseInt(el.dataset.go, 10);
    state.asked = false;
    render();
    window.scrollTo(0, 0);
  }
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-share');
  if (k) { state.share[k] = e.target.checked; }
});
render();
</script>

</body></html>
